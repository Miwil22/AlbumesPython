<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEXUS.AUDIO</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="{{ url_for('static', path='css/styles.css') }}?v=HOVER_GRIS" />

    <style>
      :root { --accent-red: #ff003c; --bg-color: #050505; }
      
      body {
        background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
        background-attachment: fixed; 
        color: #e0e0e0;
        font-family: "Rajdhani", sans-serif;
      }

      .table { --bs-table-bg: transparent !important; background-color: transparent !important; color: #e0e0e0 !important; }

      .table-dark-custom tbody tr { 
          background-color: #111 !important; 
          border: 1px solid #222; 
          transition: 0.2s; 
      }
      
      .table-dark-custom td, .table-dark-custom th {
          background-color: transparent !important;
          border-bottom: 1px solid #222;
      }

      .table-dark-custom tbody tr:hover { 
          background-color: #222 !important; 
          transform: scale(1.02); 
          box-shadow: 0 0 25px rgba(255, 0, 60, 0.2);
          z-index: 10; position: relative;
          border-color: #444;
      }
      
      .table-dark-custom tbody tr:hover td,
      .table-dark-custom tbody tr:hover .rank-num,
      .table-dark-custom tbody tr:hover .artist-col { 
          color: #fff !important; 
      }

      .table-dark-custom th {
          color: #ff003c !important; 
          text-transform: uppercase; font-family: "Oswald"; letter-spacing: 1px;
      }
      
      ::selection { background-color: #ff003c !important; color: #fff !important; }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg fixed-top" style="background-color: rgba(0,0,0,0.95); border-bottom: 1px solid #222;">
      <div class="container">
        <a class="navbar-brand" href="/" style="font-family: 'Oswald'; letter-spacing: 4px; color: #fff;">
          <i class="bi bi-soundwave me-2" style="color: #ff003c"></i> NEXUS.AUDIO
        </a>
        <div class="d-flex align-items-center">
          <a class="nav-link me-4" href="/" style="color: #888; font-family: 'Oswald'; text-decoration: none;">HOME</a>
          <a class="nav-link me-4" href="/albumes" style="color: #888; font-family: 'Oswald'; text-decoration: none;">DATABASE</a>
          <a class="nav-link" href="/albumes/new" style="color: #888; font-family: 'Oswald'; text-decoration: none;">ADD NEW</a>
        </div>
      </div>
    </nav>
    
    <div style="margin-top: 80px">
        {% block content %}{% endblock %}
    </div>

    <footer style="margin-top: auto; background-color: #000; padding: 30px; text-align: center; color: #444; border-top: 1px solid #222; font-family: 'Oswald';">
      <p>SYSTEM ONLINE // DAW2 PROJECT // 2026</p>
    </footer>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
